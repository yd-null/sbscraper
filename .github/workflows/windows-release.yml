name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]

      - name: Install Playwright Chromium into package
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Build onedir app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name sbscraper --collect-data playwright main.py

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -Recurse dist\sbscraper release\sbscraper
          Compress-Archive -Path release\sbscraper -DestinationPath release\sbscraper-windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/sbscraper-windows.zip
          generate_release_notes: true
