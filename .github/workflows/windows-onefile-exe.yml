name: Build Windows Onedir EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]

      - name: Install Playwright Chromium into package
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Build onedir app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name sbscraper --collect-data playwright main.py

      - name: Bundle runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -Recurse dist\sbscraper release\sbscraper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbscraper-windows-onedir
          path: release/*
